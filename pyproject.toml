[project]
name = "mmsid"
version = "0.1.0"
description = "Multimodal semantic IDs for generative recommendation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "limon-7", email = "liibd7@gmail.com" }]
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "sentence-transformers>=3.2",
    "sentencepiece",
    "protobuf",
    "huggingface-hub",
    "numpy",
    "pandas",
    "pyarrow",
    "faiss-cpu",
    "omegaconf",
    "aiohttp",
    "pillow",
    "tqdm",
    "tensorboard",
    "matplotlib",
]

[project.optional-dependencies]
demo = ["gradio>=5"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mmsid"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
