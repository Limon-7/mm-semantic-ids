name: tune/video_games_sasrec_d128_p0.2
data: video_games
split: last_out
seed: 0
id_seed: 0
ids:
  text: st5
  image: siglip
  spec:
    variant: T
    quantizer: rqvae
    levels: 4
    codebook_size: 256
    lf_text_levels: 2
    lf_order: text_first
  rqvae:
    hidden:
    - 512
    - 256
    - 128
    code_dim: 32
    beta: 0.25
    steps: 20000
    batch_size: 1024
    optimizer: adamw
    lr: 0.001
    restart_every: 500
  rqkmeans:
    niter: 30
model:
  type: sasrec
  tiger:
    d_model: 128
    d_ff: 1024
    d_kv: 64
    heads: 6
    layers: 4
    dropout: 0.1
    user_tokens: 2000
  sasrec:
    dim: 128
    layers: 2
    heads: 2
    dropout: 0.2
    item_input: id
train:
  batch_size: 256
  steps: 30000
  lr: 0.001
  warmup: 500
  weight_decay: 0.0
  eval_every: 1000
  eval_users: 10000
  eval_beam: 20
  patience: 5
  amp: true
eval:
  beam: 50
  batch_size: 128
  ks:
  - 5
  - 10
  test: false
